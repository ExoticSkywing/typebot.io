services:
  typebot-builder:
    image: baptistearno/typebot-builder:latest
    restart: always
    network_mode: host
    env_file: .env
    environment:
      - PORT=3170
      - HOSTNAME=0.0.0.0

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    restart: always
    network_mode: host
    env_file: .env
    environment:
      - PORT=3180
      - HOSTNAME=0.0.0.0
